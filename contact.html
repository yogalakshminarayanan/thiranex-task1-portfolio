<main id="main" tabindex="-1">
<section aria-labelledby="contact-h">
  <h1 id="contact-h">Contact me</h1>
  <p>Fill in the form below. All fields are required.</p>
  <form id="contact-form" novalidate aria-labelledby="contact-h">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-required="true" aria-describedby="name-error" aria-invalid="false">
    <p class="error" id="name-error"></p>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" aria-describedby="email-error" aria-invalid="false">
    <p class="error" id="email-error"></p>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required aria-required="true" aria-describedby="message-error" aria-invalid="false"></textarea>
    <p class="error" id="message-error"></p>
    <button type="submit">Send message</button>
    <p class="status" id="form-status" role="status"></p>
  </form>
</section>
